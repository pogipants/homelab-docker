server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name photos.juissy.net;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Immich uploads original photos and videos. Nginx defaults to 1m.
    client_max_body_size 50000M;
    client_body_timeout 600s;
    client_body_buffer_size 1024k;

    set $immich immich-server;
    resolver 127.0.0.11 valid=30s;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://$immich:2283;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Live timeline / mobile sync
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;

        # Stream large uploads instead of buffering them in nginx
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name photos.juissy.net;
    return 301 https://$host$request_uri;
}
