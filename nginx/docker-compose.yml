services:
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./sites:/etc/nginx/sites-enabled:ro
    restart: unless-stopped
    networks:
      - immich_net
      - jellyfin_net
      - wordpress_net
      - pihole_net


networks:
  immich_net:
    external: true
  jellyfin_net:
    external: true
  wordpress_net:
    external: true
  pihole_net:
    external: true

