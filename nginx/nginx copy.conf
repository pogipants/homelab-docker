events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/sites-enabled/*.conf;

    # Catch all HTTP requests on Port 80
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Option A: Close connection silently without responding (Best for security)
        return 444; 

        # Option B: Standard 404 error page
        # return 404;
    }


    # Catch all HTTPS requests on Port 443 with an untrusted default cert or connection drop
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        return 444;
    }
}
