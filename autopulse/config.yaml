app:
  hostname: 0.0.0.0
  port: 2875

auth:
  username: ${AUTH_USERNAME}
  password: ${AUTH_PASSWORD}

opts:
  check_path: true

triggers:
  media_watch:
    type: notify
    backend: polling
    paths:
      - /media/documentaries
      - /media/tv
      - /media/movies
      - /media/anime
      - /media/kids
      - /media/filipino
    recursive: true
    debounce: 10
    excludes:
      - "\\.partial$"
      - "\\.!qB$"
      - "\\.tmp$"
      - "\\.nfo$"
      - "Thumbs\\.db$"
      - "\\.DS_Store$"

targets:
  jellyfin:
    type: jellyfin
    url: http://jellyfin:8096
    token: ${JELLYFIN_API_KEY}