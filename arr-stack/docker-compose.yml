name: arr_stack

# ============================================================
# OPTIONAL SERVICES — controlled via COMPOSE_PROFILES in .env
#
#   requests   → adds Jellyseerr (media request portal for friends/family)
#   music      → adds Lidarr (music collection manager)
#   audiobooks → adds Bookshelf (audiobook automation)
#   subtitles  → adds Subgen (GPU subtitle generation, NVIDIA required)
#
# Examples:
#   COMPOSE_PROFILES=                                    # movies + shows only
#   COMPOSE_PROFILES=requests                            # + request portal
#   COMPOSE_PROFILES=requests,music                      # + requests + music
#   COMPOSE_PROFILES=requests,music,audiobooks           # + requests + music + audiobooks
#   COMPOSE_PROFILES=requests,music,audiobooks,subtitles # everything
# ============================================================

services:

  # ============================================================
  # GLUETUN — WireGuard VPN tunnel
  # All arr traffic routes through this container.
  # Nothing starts until Gluetun is confirmed healthy.
  # ============================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    privileged: true
    ports:
      - 8388:8388/tcp    # Gluetun HTTP proxy
      - 8388:8388/udp
      - 7777:7777/tcp    # Gluetun control server
      - 9696:9696/tcp    # Prowlarr
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY} # Required for some providers, optional for others
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT:-51820}
      # Allow arr containers to reach local LAN services without going through VPN
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.168.1.0/24}
      - CA_TS_FALLBACK_DIR=/gluetun
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/gluetun:/gluetun:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 https://ipinfo.io/ip || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # CORE ARR APPS — always enabled, all routed through Gluetun VPN
  # These containers share Gluetun's network namespace.
  # They communicate with each other via localhost, not container names.
  # ============================================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - 7878:7878/tcp
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/radarr:/config:rw
      - ${MEDIA_PATH}:/data:rw
      - ${DOWNLOADS_PATH}:/downloads:rw
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - 8989:8989/tcp
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/sonarr:/config:rw
      - ${MEDIA_PATH}:/data:rw
      - ${DOWNLOADS_PATH}:/downloads:rw
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config:rw
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - 6878:6878/tcp
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/bazarr:/config:rw
      - ${MEDIA_PATH}:/data:rw
    restart: unless-stopped

  # ============================================================
  # CORE CLEARNET SERVICES — not tunneled through VPN
  # ============================================================
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8 #latest
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ${APPDATA_PATH}/recyclarr:/config:rw
    environment:
      - TZ=${TZ:-America/New_York}
      - CRON_SCHEDULE=0 3 * * *
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    ports:
      - 8090:8080/tcp
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-America/New_York}
      # Force SAB to use Docker paths instead of /config/Downloads
    volumes:
      - ${APPDATA_PATH}/sabnzbd:/config:rw
      - ${DOWNLOADS_PATH}:/downloads:rw
      - ${CACHE_DOWNLOADS_PATH}:/cache_downloads:rw
    restart: unless-stopped

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APPDATA_PATH}/decluttarr:/app/config:rw
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    # environment:
    #   LOG_LEVEL: debug
    build:
      context: .
      dockerfile: Dockerfile
    # Uncomment below to use byparr outside of internal network
    ports:
      - "8191:8191"


  # ============================================================
  # OPTIONAL: REQUESTS — enable with COMPOSE_PROFILES=requests
  # Netflix-style request portal for friends and family.
  # They browse, click Request, and the rest is automatic.
  # ============================================================
  jellyseerr:
    profiles:
      - requests
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports:
      - 5055:5055/tcp
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/jellyseerr:/app/config:rw
    restart: unless-stopped

  # ============================================================
  # OPTIONAL: MUSIC — enable with COMPOSE_PROFILES=music
  # ============================================================
  lidarr:
    profiles:
      - music
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports:
      - 8686:8686/tcp
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${APPDATA_PATH}/lidarr:/config:rw
      - ${MEDIA_PATH}/music:/music:rw
      - ${DOWNLOADS_PATH}:/downloads:rw
    restart: unless-stopped

  # ============================================================
  # OPTIONAL: AUDIOBOOKS — enable with COMPOSE_PROFILES=audiobooks
  # ============================================================

  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:${SHELFARR_VERSION:-latest}
    container_name: shelfarr
    profiles:
      - audiobooks
    restart: unless-stopped
    ports:
      - "5056:${HTTP_PORT:-80}"
    volumes:
      # Database and app storage (required - contains auto-generated secret key)
      - /apps/runtime/shelfarr:/rails/storage
      # Audiobooks output folder (where Shelfarr places completed audiobooks)
      - /mnt/bigshare/Media/audiobooks:/audiobooks
      # Ebooks output folder (where Shelfarr places completed ebooks)
      - /mnt/bigshare/Media/ebooks:/ebooks
      # Download client completed folder (where downloads land before processing)
      - /mnt/bigshare/Media/downloads:/downloads
    environment:
      - SOLID_QUEUE_IN_PUMA=1
      # Keep these identical to the companion so both services can use the
      # read-only token and completed-backup volumes.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - CHOWN_ON_START=${CHOWN_ON_START:-auto}
      - TZ=${TZ:-UTC}
      # Optional: Change internal port (default: 80)
      # - HTTP_PORT=8080
      # Optional: Set your own key instead of auto-generating
      # - RAILS_MASTER_KEY=your-64-char-hex-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HTTP_PORT:-80}/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # OPTIONAL: GPU SUBTITLES — enable with COMPOSE_PROFILES=subtitles
  # Requires NVIDIA GPU and nvidia-docker2 / NVIDIA Container Runtime
  # ============================================================
  subgen:
    profiles:
      - subtitles
    image: mccloud/subgen:latest
    container_name: subgen
    ports:
      - 9000:9000/tcp
    environment:
      - CONCURRENT_TRANSCRIPTIONS=2
      - USE_PATH_MAPPING=false
      - MODEL_PATH=./models
      - NVIDIA_VISIBLE_DEVICES=all
      - COMPUTE_TYPE=float32
      - CLEAR_VRAM_ON_COMPLETE=True
    volumes:
      - ${APPDATA_PATH}/subgen/models:/subgen/models:rw
      - ${APPDATA_PATH}/subgen/subgen.env:/subgen/subgen.env:ro
      - ${MEDIA_PATH}:/data:rw
    runtime: nvidia
    restart: unless-stopped
